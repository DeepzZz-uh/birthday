<div class="hero">

    <img src="sukoon.jpeg">

        <h1>The Story of Us ❤️</h1>
        <p>A Netflix Original Birthday Special</p>

       <button onclick="openSong()">▶ Play</button>
        <button id="myListBtn" onclick="toggleMyList()">+ My List</button>

    ❤️ Added to My List

<div id="songScreen" class="song-screen">

</video>

<script>

function openSong() {

    const screen = document.getElementById("songScreen");
    const video = document.getElementById("songVideo");

    screen.style.display = "flex";

    video.play();
}


function closeSong() {

    const screen = document.getElementById("songScreen");
    const video = document.getElementById("songVideo");

    video.pause();

    video.currentTime = 0;

    screen.style.display = "none";
}

</script>
<script>

function toggleMyList() {

    const button = document.getElementById("myListBtn");
    const message = document.getElementById("myListMessage");

    if (button.innerHTML === "+ My List") {

        button.innerHTML = "✓ My List";
        message.style.display = "inline";

    } else {

        button.innerHTML = "+ My List";
        message.style.display = "none";

    }
}
</script>
